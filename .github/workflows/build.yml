name: Build and Release WinForms Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download bundled 7zr
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "src/Launcher.UI/tools/7zip" -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile "src/Launcher.UI/tools/7zip/7zr.exe"
          if (-not (Test-Path "src/Launcher.UI/tools/7zip/7zr.exe")) {
            throw "7zr.exe download failed."
          }

      - name: Restore
        run: dotnet restore Launcher.WinForms.sln

      - name: Build
        run: dotnet build Launcher.WinForms.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Launcher.WinForms.sln --configuration Release --no-build --verbosity normal

      - name: Publish WinForms app
        run: dotnet publish src/Launcher.UI/Launcher.UI.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o out/launcher

      - name: Package launcher
        shell: powershell
        run: Compress-Archive -Path "out/launcher/*" -DestinationPath "lastchaos-launcher-windows-x86.zip" -Force

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: lastchaos-launcher-windows-x86.zip
          tag_name: latest
          name: Latest Build
          body: "LastChaos WinForms launcher build"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
