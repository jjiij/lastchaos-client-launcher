name: Build and Release WinForms Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download bundled 7zr
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile "src/Launcher.UI/7zr.exe"
          if (-not (Test-Path "src/Launcher.UI/7zr.exe")) {
            throw "7zr.exe download failed."
          }

      - name: Restore
        run: dotnet restore Launcher.WinForms.sln

      - name: Build
        run: dotnet build Launcher.WinForms.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Launcher.WinForms.sln --configuration Release --no-build --verbosity normal

      - name: Publish WinForms app
        run: dotnet publish src/Launcher.UI/Launcher.UI.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false -o out/launcher

      - name: Prepare release exe and PDB bundle
        shell: powershell
        run: |
          $publishedExe = Join-Path $pwd "out/launcher/Launcher.UI.exe"
          if (-not (Test-Path $publishedExe)) {
            throw "Published launcher exe not found at $publishedExe"
          }

          Copy-Item $publishedExe "LastChaosGenesis-Setup.exe" -Force

          $pdbDir = Join-Path $pwd "out/pdb"
          New-Item -ItemType Directory -Path $pdbDir -Force | Out-Null
          Get-ChildItem -Path "src","tests" -Recurse -Filter *.pdb -ErrorAction SilentlyContinue |
            Copy-Item -Destination $pdbDir -Force

          if (Get-ChildItem -Path $pdbDir -Filter *.pdb -ErrorAction SilentlyContinue) {
            Compress-Archive -Path "$pdbDir/*" -DestinationPath "LastChaosGenesis-pdb.zip" -Force
          } else {
            Write-Host "No PDB files found; creating empty marker zip."
            "No PDB files were produced in this build." | Out-File -FilePath "$pdbDir/README.txt" -Encoding utf8
            Compress-Archive -Path "$pdbDir/*" -DestinationPath "LastChaosGenesis-pdb.zip" -Force
          }

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LastChaosGenesis-Setup.exe
            LastChaosGenesis-pdb.zip
          tag_name: latest
          name: Latest Build
          body: "LastChaos WinForms launcher build"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
